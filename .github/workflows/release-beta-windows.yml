name: Release Beta (Windows)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or tag to build
        required: true
        default: beta/1.0.0-beta.1

jobs:
  release:
    permissions:
      contents: write
    environment: windows-release
    runs-on: windows-latest
    env:
      VITE_AI_DEFAULT_API_KEY: ${{ secrets.VITE_AI_DEFAULT_API_KEY }}
      TIEZ_PLATFORM: windows
      TIEZ_RELEASE_CHANNEL: beta
      TIEZ_ANNOUNCEMENT_PING_URL: ${{ vars.TIEZ_ANNOUNCEMENT_PING_URL }}
      VITE_TIEZ_ANNOUNCEMENT_PING_URL: ${{ vars.TIEZ_ANNOUNCEMENT_PING_URL }}
      TIEZ_UPDATE_ENDPOINT: ${{ vars.TIEZ_UPDATE_ENDPOINT }}
      VITE_TIEZ_UPDATE_ENDPOINT: ${{ vars.VITE_TIEZ_UPDATE_ENDPOINT }}
      TIEZ_UPDATER_PUBLIC_KEY: ${{ vars.TIEZ_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: install frontend dependencies
        run: npm ci

      - name: prepare release config
        run: node scripts/configure-release.mjs

      - name: validate release metadata
        run: npm run validate-release

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: beta-v__VERSION__
          releaseName: TieZ Windows beta v__VERSION__
          releaseBody: Beta build for community testing. Channel=beta; can update to newer beta or stable when published.
          releaseDraft: true
          prerelease: true
          args: --config src-tauri/tauri.windows.conf.json

      - name: Upload beta bundles
        uses: actions/upload-artifact@v4
        with:
          name: windows-beta-installer
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/nsis/*.nsis.zip
            src-tauri/target/**/bundle/nsis/*.sig
